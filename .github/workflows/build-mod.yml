name: build-mod
on:
  push:
    paths:
      - "autototem-mod/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autototem-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: autototem
          path: |
            autototem-mod/build/libs/*.jar
            !autototem-mod/build/libs/*-sources.jar
